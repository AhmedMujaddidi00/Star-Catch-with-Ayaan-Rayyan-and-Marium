<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Star Catch with Ayaan & Rayyan</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#d4f0ff;--ink:#23205a;--sun:#ffc933;--blue:#2f80ed;--green:#27ae60;--panel:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1a45;--ink:#fff6d6;--panel:#2c2a68}}
:root[data-theme="dark"]{--bg:#1b1a45;--ink:#fff6d6;--panel:#2c2a68}
html,body{height:100%;margin:0}
body{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2","Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center;align-items:flex-start;overflow-x:hidden}
main{width:100%;max-width:460px;padding:14px 16px;box-sizing:border-box;text-align:center}
[hidden]{display:none!important}
h1{font-size:clamp(2.6rem,12vw,3.6rem);font-weight:800;margin:10px 0 0;line-height:1;text-shadow:3px 3px 0 var(--sun)}
.sub{font-size:1.2rem;margin:10px 0 18px}
.heroes{display:grid;gap:14px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}
.hero{display:flex;align-items:center;gap:14px;padding:12px 18px;border-radius:32px;background:var(--panel);text-align:left;border:5px solid var(--c);box-shadow:0 6px 0 var(--c);transition:transform .12s}
.hero:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.hero b{display:block;font-size:2rem;font-weight:800;line-height:1}
.hero span{font-size:1.05rem}
.big{font-size:1.5rem;font-weight:800;padding:10px 28px;border-radius:999px;background:var(--sun);color:#23205a;box-shadow:0 5px 0 #d99a00;margin:6px}
.big.alt{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.25)}
.hud{display:flex;justify-content:space-between;font-size:1.5rem;font-weight:800;padding:0 6px 6px}
canvas{display:block;margin:0 auto;border-radius:24px;touch-action:none;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.tip{font-size:1rem;margin:8px 0 0;opacity:.85}
.score{font-size:4.5rem;font-weight:800;line-height:1;margin:6px 0}
</style>
</head>
<body>
<main>
  <section id="home">
    <h1>Star Catch</h1>
    <p class="sub">Pick your hero and catch the falling stars!</p>
    <div class="heroes">
      <button class="hero" data-k="ayaan" style="--c:var(--blue)"><span id="fa"></span><div><b>Ayaan</b><span>Super speedy</span></div></button>
      <button class="hero" data-k="rayyan" style="--c:var(--green)"><span id="fr"></span><div><b>Rayyan</b><span>Extra-wide basket</span></div></button>
      <button class="hero" data-k="marium" style="--c:#ff3d81"><span id="fm"></span><div><b>Marium</b><span>Perfectly balanced</span></div></button>
    </div>
    <p class="tip">Gold stars are worth 5. Dodge the grumpy clouds!</p>
  </section>

  <section id="play" hidden>
    <div class="hud"><span id="sc">★ 0</span><span id="tm">45</span><span id="ht">♥♥♥</span></div>
    <canvas id="cv" aria-label="Star Catch game"></canvas>
    <p class="tip">Drag or use the arrow keys to move.</p>
  </section>

  <section id="end" hidden>
    <h1 id="endT">Great job!</h1>
    <div class="score" id="endS">0</div>
    <p class="sub" id="endM"></p>
    <button class="big" id="again">Play again</button>
    <button class="big alt" id="switch">Switch hero</button>
  </section>
</main>
<script>
if(window.CanvasRenderingContext2D&&!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()}}
const W=360,H=560,$=id=>document.getElementById(id);
const KIDS={
  ayaan:{name:'Ayaan',shirt:'#2f80ed',hair:'#2b1b17',skin:'#f0bf94',bw:84,follow:30,key:540},
  rayyan:{name:'Rayyan',shirt:'#27ae60',hair:'#4a2a17',skin:'#e0a878',bw:128,follow:13,key:380},
  marium:{name:'Marium',shirt:'#ff3d81',hair:'#2b1b17',skin:'#f0bf94',bw:104,follow:20,key:450}
};
function face(k){const o=KIDS[k];
  const hair=k!=='rayyan'
    ?`<path d="M20 46 Q20 14 50 14 Q80 14 80 46 Q68 30 50 32 Q32 30 20 46Z" fill="${o.hair}"/>${k==='marium'?`<circle cx="16" cy="54" r="9" fill="${o.hair}"/><circle cx="84" cy="54" r="9" fill="${o.hair}"/>`:''}`
    :[[24,32],[36,20],[50,16],[64,20],[76,32]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="12" fill="${o.hair}"/>`).join('');
  return `<svg viewBox="0 0 100 110" width="84" height="92" aria-hidden="true"><rect x="22" y="78" width="56" height="32" rx="14" fill="${o.shirt}"/><circle cx="50" cy="46" r="28" fill="${o.skin}"/>${hair}<circle cx="40" cy="48" r="3.5" fill="#23205a"/><circle cx="60" cy="48" r="3.5" fill="#23205a"/><path d="M38 58 Q50 70 62 58" stroke="#23205a" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="33" cy="58" r="4" fill="#ff9aa2" opacity=".6"/><circle cx="67" cy="58" r="4" fill="#ff9aa2" opacity=".6"/></svg>`;
}
$('fa').innerHTML=face('ayaan');$('fr').innerHTML=face('rayyan');$('fm').innerHTML=face('marium');

const cv=$('cv'),c=cv.getContext('2d');
const dpr=Math.min(window.devicePixelRatio||1,2);
cv.width=W*dpr;cv.height=H*dpr;
function fit(){const s=Math.min((Math.min(innerWidth,460)-32)/W,(innerHeight-150)/H,1.2);cv.style.width=W*s+'px';cv.style.height=H*s+'px'}
addEventListener('resize',fit);

let g={on:false},best=0;
try{best=+localStorage.getItem('ar-best')||0}catch(e){}
const keys={};
addEventListener('keydown',e=>{keys[e.key]=true;if(g.on&&e.key.startsWith('Arrow'))e.preventDefault()});
addEventListener('keyup',e=>keys[e.key]=false);
function pt(e){const r=cv.getBoundingClientRect();g.tx=(e.clientX-r.left)/r.width*W}
cv.addEventListener('pointerdown',pt);cv.addEventListener('pointermove',pt);

function show(id){['home','play','end'].forEach(s=>$(s).hidden=s!==id)}
document.querySelectorAll('.hero').forEach(b=>b.onclick=()=>start(b.dataset.k));
$('again').onclick=()=>start(g.k);
$('switch').onclick=()=>show('home');

function start(k){
  g={on:true,k,score:0,time:45,hearts:3,items:[],pops:[],spawn:.5,x:W/2,tx:W/2,hit:0,t:0,last:performance.now()};
  show('play');fit();hud();requestAnimationFrame(loop);
}
function hud(){$('sc').textContent='★ '+g.score;$('tm').textContent=Math.ceil(g.time);$('ht').textContent='♥'.repeat(g.hearts)+'♡'.repeat(3-g.hearts)}
function finish(){
  g.on=false;const o=KIDS[g.k];
  const nb=g.score>best;if(nb){best=g.score;try{localStorage.setItem('ar-best',best)}catch(e){}}
  $('endT').textContent=g.score>=40?o.name+' is a superstar!':g.score>=20?'Awesome, '+o.name+'!':'Nice try, '+o.name+'!';
  $('endS').textContent='★ '+g.score;
  $('endM').textContent=nb&&g.score>0?'New best score!':'Best score: '+best;
  show('end');
}

function loop(now){
  if(!g.on)return;
  const dt=Math.min((now-g.last)/1000,.05);g.last=now;
  const o=KIDS[g.k],P_Y=H-96;
  g.t+=dt;g.time-=dt;
  if(keys.ArrowLeft||keys.a)g.tx-=o.key*dt;
  if(keys.ArrowRight||keys.d)g.tx+=o.key*dt;
  g.tx=Math.max(o.bw/2,Math.min(W-o.bw/2,g.tx));
  g.x+=(g.tx-g.x)*(1-Math.exp(-o.follow*dt));
  g.spawn-=dt;
  if(g.spawn<=0){
    g.spawn=Math.max(.38,.85-g.t/80);
    const r=Math.random(),type=r<.2?'cloud':r<.3?'gold':'star';
    g.items.push({type,x:28+Math.random()*(W-56),y:-24,v:110+Math.random()*60+g.t*2.2,r:type==='gold'?21:17,a:0});
  }
  g.items=g.items.filter(it=>{
    it.y+=it.v*dt;it.a+=dt*3;
    if(it.y>P_Y-62&&it.y<P_Y-22&&Math.abs(it.x-g.x)<o.bw/2+it.r*.3){
      if(it.type==='cloud'){g.hearts--;g.hit=.35;g.pops.push({x:it.x,y:it.y,t:0,s:'Oops!',c:'#ff5a6e'})}
      else{const p=it.type==='gold'?5:1;g.score+=p;g.pops.push({x:it.x,y:it.y,t:0,s:'+'+p,c:it.type==='gold'?'#ffb300':'#ffffff'})}
      hud();return false;
    }
    return it.y<H+30;
  });
  g.pops.forEach(p=>p.t+=dt);g.pops=g.pops.filter(p=>p.t<.8);
  g.hit=Math.max(0,g.hit-dt);
  hud();draw(o,P_Y);
  if(g.time<=0||g.hearts<=0){g.time=Math.max(0,g.time);hud();finish();return}
  requestAnimationFrame(loop);
}

function rr(x,y,w,h,r){c.beginPath();c.roundRect(x,y,w,h,r);c.fill()}
function star(x,y,r,fill,a){
  c.save();c.translate(x,y);c.rotate(Math.sin(a)*.25);c.fillStyle=fill;c.strokeStyle='#fff';c.lineWidth=2.5;c.lineJoin='round';
  c.beginPath();for(let i=0;i<10;i++){const t=-Math.PI/2+i*Math.PI/5,d=i%2?r*.45:r;c.lineTo(Math.cos(t)*d,Math.sin(t)*d)}
  c.closePath();c.fill();c.stroke();c.restore();
}
function cloud(x,y,r){
  c.fillStyle='#6e6aa8';
  [[-.6,.1,.6],[0,-.3,.8],[.6,.1,.6]].forEach(a=>{c.beginPath();c.arc(x+a[0]*r,y+a[1]*r,a[2]*r,0,7);c.fill()});
  c.fillStyle='#fff';c.beginPath();c.arc(x-6,y-2,4,0,7);c.arc(x+6,y-2,4,0,7);c.fill();
  c.strokeStyle='#23205a';c.lineWidth=2.5;c.lineCap='round';
  c.beginPath();c.moveTo(x-11,y-9);c.lineTo(x-3,y-6);c.moveTo(x+11,y-9);c.lineTo(x+3,y-6);c.moveTo(x-5,y+9);c.quadraticCurveTo(x,y+4,x+5,y+9);c.stroke();
}
function kid(x,y,k){
  const o=KIDS[k],bw=o.bw;
  c.strokeStyle=o.skin;c.lineWidth=7;c.lineCap='round';
  c.beginPath();c.moveTo(x-16,y+26);c.lineTo(x-bw/2+10,y-30);c.moveTo(x+16,y+26);c.lineTo(x+bw/2-10,y-30);c.stroke();
  c.fillStyle='#23205a';rr(x-14,y+56,10,22,4);rr(x+4,y+56,10,22,4);
  c.fillStyle=o.shirt;rr(x-19,y+18,38,42,12);
  c.fillStyle=o.skin;c.beginPath();c.arc(x,y,21,0,7);c.fill();
  c.fillStyle=o.hair;
  if(k!=='rayyan'){if(k==='marium'){c.beginPath();c.arc(x-23,y+4,8,0,7);c.arc(x+23,y+4,8,0,7);c.fill()}c.beginPath();c.moveTo(x-21,y-2);c.quadraticCurveTo(x-21,y-26,x,y-24);c.quadraticCurveTo(x+21,y-26,x+21,y-2);c.quadraticCurveTo(x+10,y-14,x,y-14);c.quadraticCurveTo(x-10,y-14,x-21,y-2);c.fill()}
  else{[[-16,-12],[-8,-20],[0,-22],[8,-20],[16,-12]].forEach(p=>{c.beginPath();c.arc(x+p[0],y+p[1],9,0,7);c.fill()})}
  c.fillStyle='#23205a';c.beginPath();c.arc(x-7,y+1,2.6,0,7);c.arc(x+7,y+1,2.6,0,7);c.fill();
  c.strokeStyle='#23205a';c.lineWidth=2.6;c.beginPath();c.arc(x,y+6,8,.2,Math.PI-.2);c.stroke();
  c.fillStyle='#e8a03a';c.beginPath();c.moveTo(x-bw/2,y-58);c.lineTo(x+bw/2,y-58);c.lineTo(x+bw/2-10,y-30);c.lineTo(x-bw/2+10,y-30);c.closePath();c.fill();
  c.fillStyle='#c97d1c';rr(x-bw/2-3,y-63,bw+6,10,5);
}
function draw(o,py){
  c.setTransform(dpr,0,0,dpr,0,0);
  const sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#7fd2ff');sky.addColorStop(1,'#e3f7ff');
  c.fillStyle=sky;c.fillRect(0,0,W,H);
  c.fillStyle='#ffd84d';c.beginPath();c.arc(W-60,60,32,0,7);c.fill();
  c.fillStyle='#8fe3a5';c.beginPath();c.ellipse(70,H-30,170,80,0,0,7);c.fill();
  c.fillStyle='#6fd18a';c.beginPath();c.ellipse(W-40,H-24,190,70,0,0,7);c.fill();
  c.fillStyle='#4cbf6b';c.fillRect(0,H-22,W,22);
  g.items.forEach(it=>it.type==='cloud'?cloud(it.x,it.y,it.r):star(it.x,it.y,it.r,it.type==='gold'?'#ffa400':'#ffd633',it.a));
  kid(g.x,py,g.k);
  g.pops.forEach(p=>{c.globalAlpha=1-p.t/.8;c.fillStyle=p.c;c.strokeStyle='#23205a';c.lineWidth=4;c.font='800 26px "Baloo 2",sans-serif';c.textAlign='center';c.strokeText(p.s,p.x,p.y-p.t*50);c.fillText(p.s,p.x,p.y-p.t*50);c.globalAlpha=1});
  if(g.hit>0){c.fillStyle='rgba(255,60,90,'+g.hit*.6+')';c.fillRect(0,0,W,H)}
}
</script>
</body>
</html>
